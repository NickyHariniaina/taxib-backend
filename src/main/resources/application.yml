# TaxiB backend configuration.
#
# SUPABASE_DB_URL must be set in the environment (never commit the password):
#   Session pooler, port 5432 (Hibernate needs prepared statements,
#   so the transaction pooler on 6543 does NOT work).
#   jdbc:postgresql://aws-<region>.pooler.supabase.com:5432/postgres?user=postgres.<ref>&password=...&sslmode=require
#
# Supabase dashboard prerequisite (one click): enable the `postgis` extension
# into the `extensions` schema. V1__ migration also tries CREATE EXTENSION.

spring:
  datasource:
    url: ${SUPABASE_DB_URL:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      connection-init-sql: SET search_path TO "$user", public, extensions
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
