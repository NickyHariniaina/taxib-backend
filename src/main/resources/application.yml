# TaxiB backend configuration.
#
# Runtime env (export before boot, never commit values — see env.example.txt):
#   SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
#     App traffic. Bound automatically, nothing to declare here.
#     Neon: pooled URL (host with "-pooler").
#   SPRING_FLYWAY_URL / SPRING_FLYWAY_USER / SPRING_FLYWAY_PASSWORD (optional)
#     Migrations. Falls back to the datasource URL when unset (local Docker case).
#     Neon pooled connections can't run migrations (no session locks, no SET),
#     so set these to the DIRECT url (same host without "-pooler").
#
# Database prerequisite (one click / one statement): PostGIS extension enabled.
# Neon: CREATE EXTENSION IF NOT EXISTS postgis; (public schema, the default).

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
